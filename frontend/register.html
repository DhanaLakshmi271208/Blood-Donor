<!DOCTYPE html>

        <link rel="stylesheet"href="css/style.css">

            <option>B-</option>
            <option>O+</option>
            <option>O-</option>
            <option>AB+</option>
            <option>AB-</option>    
            </select>
            <input type="text"id="phone"placeholder="Phone Number">
            <button onclick="register()">Register</button>
            <a href="login.html">
            <button>login</button>
            </a>

        </div>
        <script src="script.js"></script>
    </body>
</html>
